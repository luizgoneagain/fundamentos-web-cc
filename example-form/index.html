<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de formulário em HTML</title>
</head>
<body>
    <header>
        <h3>Formulários e Inputs</h3>
    </header>

    <main>
        <form id="registerForm" method="POST">
            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" name="nome" required />
            <br>
            <br>

            <label for="email">Endereço de e-mail:</label>
            <input type="email" id="email" name="email" />
            <br>
            <br>

            <label for="senha">Informe sua senha:</label>
            <input type="password" id="senha" name="senha" required minlength="8"
                title="A senha deve ter no mínimo 8 caracteres">
            <br>
            <br>

            <label for="mensagem">Informe sua mensagem:</label>
            <br>
            <textarea name="mensagem" id="mensagem" rows="10" cols="30"></textarea>
            <br>
            <br>

            <label for="evento">Selecione o evento escolhido:</label>
            <!-- tag de seletor, ao selecionar uma das opções o value da option é atribuído ao name do select -->
            <!-- key:value -->
            <!-- evento:teatro -->
            <select id="evento" name="evento">
                <option value="rock">Show de rock</option>
                <option value="modao">Show de sertanejo</option>
                <option value="teatro">Teatro</option>
            </select>
            <br>
            <br>

            <!-- input checkbox -> opção de múltipla escolha -->
            <label for="termos">
                <input type="checkbox" id="termos" name="termos" required />
                Aceito os termos de uso
            </label>
            <br>
            <br>

            <!-- input type radio -> escolha única -->
            <!-- para o type radio funcionar ambos os inputs devem compartilhar o mesmo name -->
            <label><input type="radio" name="pagamento" value="pix" />Pix</label>
            <label><input type="radio" name="pagamento" value="cartao" />Cartão</label>
            <br>
            <br>

            <input type="date">
            <br>
            <input type="file">
            <br>
            <br>

            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required
                pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
                title="Formato esperado: 000.000.000-00" />
            <br>
            <br>

            <input type="submit" value="Cadastrar" />
            <button type="button">Cancelar</button>
            <br>
            <br>
        </form>
    </main>

    <footer>
        <p>Desenvolvido por Luiz</p>
    </footer>

    <script>
        document.getElementById('registerForm')
            .addEventListener('submit', function (event) {
                event.preventDefault(); // impede o comportamento padrão de envio do formulário (recarregamento)
                const nome = document.getElementById('nome').value;
                alert('Olá, ' + nome + ', cadastro enviado com sucesso');
            })
    </script>

</body>
</html>
