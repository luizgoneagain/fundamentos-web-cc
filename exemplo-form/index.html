<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de formulário em HTML</title>
</head>
<body>
    <header>
        <h3>form inputs</h3>
    </header>
    <main>
        <form action="registerForm" method="POST" action="../">
            <label>Nome completo:</label>
            <input type="text id="name" name="name"/>

            <label for="senha">Informe sua senha:</label>
            <input type="password" name="senha" id="senha" required minlength="8">

            <label for="mensagem">informe sua mensagem:</label>
            <br>
            <textarea name="mensagem" id="mensagem" rows="4" cols="30"></textarea>
            <br>
            <label for="evento">selecione o evento escolhido:</label>
            <!--tag de seletor, ao selecionar uma das opções o value da option é atribuido ao nome do select-->
            <!--key:value-->
            <!--evento = teatro-->
            <select name="evento" id="evento">
                <option value="rock">show de rock</option>
                <option value="modao">show de sertanejo</option>
                <option value="teatro">show de comédia</option>

            </select>
            <br>
            <label for="termos">
                <input type="checkbox" name="termos" id="termos" required>
                Aceito os termos de uso
            </label>
            <br>
            <!--input type radio - escolha única-->
            <label><input type="radio" name="pagamento" value="pix">pix</label>
            <label><input type="radio" name="pagamento" value="cartao">cartão</label>
            <input
            type="text"
            id="cpf"
            name="cpf"
            placeholder="000.000.000-00"
            required
            pattern="\d{3}\.\d{3}\.\d{3}\.\-\d{2}"
            
            >
            <br>
            <input type="submit" value="Cadastrar">
        </form>
    </main>
    <footer>
        <p>Desenvolvido por Luiz</p>
    </footer>

    <script>
        document.getElementById('registereForm').addEventListener('Submit', function (event)
        {
            event.preventDefault(); //impede o comportamento padrão de envio do formulário (recarregamento)
            const nome = document;getElementById('nome').value;
            alert('Olá,'+ nome+'cadastro enviado com sucesso');
        })
    </script>

</body>
</html>
